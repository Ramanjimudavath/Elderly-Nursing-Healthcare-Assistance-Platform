<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - ElderlyCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="data-service.js"></script>

    <style>
      #three-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }
      body {
        background: transparent;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
      }
      .bg-glass {
        background: rgba(15, 23, 42, 0.7) !important;
        backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
      }
      input,
      select {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #e2e8f0 !important;
        border-radius: 0.5rem !important;
      }
      input:focus,
      select:focus {
        outline: 2px solid #3b82f6 !important;
      }
      .profile-pic-wrapper {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto;
      }
      .profile-pic {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgba(59, 130, 246, 0.5);
      }
      .pic-upload-btn {
        position: absolute;
        bottom: 0;
        right: 0;
        background: #3b82f6;
        color: white;
        border-radius: 50%;
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: 2px solid #0f172a;
      }
    </style>
  </head>
  <body>
    <div id="three-bg"></div>

    <nav
      class="bg-glass shadow-md p-4 flex items-center justify-between sticky top-0 z-50"
    >
      <a href="index.html" class="flex items-center text-xl font-bold">
        <i class="fas fa-arrow-left mr-3 text-blue-400"></i> Back to Dashboard
      </a>
      <span class="text-gray-400">My Profile</span>
    </nav>

    <div class="max-w-3xl mx-auto mt-10 px-4 relative z-10">
      <div class="bg-glass rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
          <div class="profile-pic-wrapper">
            <img
              id="profileImageDisplay"
              src="https://ui-avatars.com/api/?name=User&background=3b82f6&color=fff&size=128"
              alt="Profile"
              class="profile-pic"
            />
            <label for="profilePicInput" class="pic-upload-btn">
              <i class="fas fa-camera"></i>
            </label>
            <input
              type="file"
              id="profilePicInput"
              accept="image/*"
              class="hidden"
            />
          </div>
          <h2 id="displayName" class="text-2xl font-bold mt-4">Loading...</h2>
          <p id="displayEmail" class="text-gray-400">Loading...</p>
        </div>

        <form id="profileForm" class="space-y-4 border-t border-white/10 pt-6">
          <div>
            <label class="block text-sm font-medium text-gray-400"
              >Full Name</label
            >
            <input type="text" id="editName" required class="w-full mt-1 p-3" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-400"
              >Email Address (Cannot change)</label
            >
            <input
              type="email"
              id="editEmail"
              disabled
              class="w-full mt-1 p-3 opacity-60 cursor-not-allowed"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-500/30 mt-4"
          >
            <i class="fas fa-save mr-2"></i> Save Changes
          </button>
          <div
            id="profileSuccess"
            class="hidden mt-3 p-3 bg-green-500/20 text-green-400 rounded-lg text-center"
          >
            Profile updated successfully!
          </div>
        </form>
      </div>
    </div>

    <!-- ====== 3D ANIMATION ENGINE ====== -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      const container = document.getElementById("three-bg");
      const scene = new THREE.Scene();
      const canvas = document.createElement("canvas");
      canvas.width = 2;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, "#0a1628");
      gradient.addColorStop(0.5, "#0f2847");
      gradient.addColorStop(1, "#1a365d");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 2, 512);
      scene.background = new THREE.CanvasTexture(canvas);
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 10);
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.5;
      container.appendChild(renderer.domElement);
      scene.add(new THREE.AmbientLight(0x88bbff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);
      scene.add(new THREE.PointLight(0x3b82f6, 2.0).position.set(-5, 0, -5));
      scene.add(new THREE.PointLight(0xec4899, 1.2).position.set(5, -3, -2));
      scene.add(new THREE.PointLight(0x60a5fa, 1.5).position.set(0, 5, 0));
      const group = new THREE.Group();
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0x3b82f6,
        emissive: 0x3b82f6,
        emissiveIntensity: 0.8,
        transparent: true,
        opacity: 0.9,
      });
      group.add(
        (new THREE.Mesh(
          new THREE.TorusGeometry(2.2, 0.06, 16, 100),
          ringMat,
        ).rotation.x = Math.PI / 2),
      );
      const crossGroup = new THREE.Group();
      const barMat = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xef4444,
        emissiveIntensity: 1.2,
      });
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 0.2), barMat),
      );
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.4, 0.2), barMat),
      );
      crossGroup.position.set(0, 0, 0.5);
      group.add(crossGroup);
      const pCount = 800;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pCol = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        pPos[i * 3] = (Math.random() - 0.5) * 24;
        pPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
        pPos[i * 3 + 2] = (Math.random() - 0.5) * 10;
        const c = new THREE.Color().setHSL(
          0.55 + Math.random() * 0.2,
          0.9,
          0.5 + Math.random() * 0.3,
        );
        pCol[i * 3] = c.r;
        pCol[i * 3 + 1] = c.g;
        pCol[i * 3 + 2] = c.b;
      }
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
      group.add(
        new THREE.Points(
          pGeo,
          new THREE.PointsMaterial({
            size: 0.05,
            transparent: true,
            opacity: 0.9,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
          }),
        ),
      );
      scene.add(group);
      function animate() {
        requestAnimationFrame(animate);
        group.rotation.y += 0.005;
        group.rotation.x = Math.sin(Date.now() * 0.0004) * 0.1;
        const scale = 1 + Math.sin(Date.now() * 0.003) * 0.08;
        crossGroup.scale.set(scale, scale, scale);
        renderer.render(scene, camera);
      }
      animate();
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>

    <script>
      const userId = localStorage.getItem("currentUserId");
      if (!userId) {
        alert("Please login first!");
        window.location.href = "login.html";
      }

      // Load User Data
      const db = JSON.parse(localStorage.getItem("elderlyCareData"));
      const currentUser = db.users.find((u) => u.id == userId);

      if (currentUser) {
        document.getElementById("displayName").textContent = currentUser.name;
        document.getElementById("displayEmail").textContent = currentUser.email;
        document.getElementById("editName").value = currentUser.name;
        document.getElementById("editEmail").value = currentUser.email;

        // Load Profile Picture if exists
        if (currentUser.profilePic) {
          document.getElementById("profileImageDisplay").src =
            currentUser.profilePic;
        }
      }

      // Profile Picture Upload (Base64)
      document
        .getElementById("profilePicInput")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (event) {
              document.getElementById("profileImageDisplay").src =
                event.target.result;
              // Save to DB
              currentUser.profilePic = event.target.result;
              const userIndex = db.users.findIndex((u) => u.id == userId);
              db.users[userIndex] = currentUser;
              localStorage.setItem("elderlyCareData", JSON.stringify(db));
            };
            reader.readAsDataURL(file);
          }
        });

      // Update Name
      document
        .getElementById("profileForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const newName = document.getElementById("editName").value;

          currentUser.name = newName;
          const userIndex = db.users.findIndex((u) => u.id == userId);
          db.users[userIndex] = currentUser;
          localStorage.setItem("elderlyCareData", JSON.stringify(db));

          document.getElementById("displayName").textContent = newName;
          document.getElementById("profileSuccess").classList.remove("hidden");
          setTimeout(() => {
            document.getElementById("profileSuccess").classList.add("hidden");
          }, 3000);
        });
    </script>
  </body>
</html>
