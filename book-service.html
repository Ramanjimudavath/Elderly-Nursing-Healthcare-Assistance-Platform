<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Service - ElderlyCare</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="data-service.js"></script>

    <style>
      * {
        font-family: "Inter", sans-serif;
      }

      /* ====== 3D ANIMATION BACKGROUND ====== */
      #three-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }

      /* ====== DARK MODE BACKGROUND ====== */
      body {
        background: transparent;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      .bg-white,
      .bg-gray-50,
      .bg-gray-100 {
        background: rgba(15, 23, 42, 0.6) !important;
        backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        color: #e2e8f0 !important;
      }

      nav.bg-white {
        background: rgba(15, 23, 42, 0.85) !important;
        backdrop-filter: blur(16px) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5) !important;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      .text-gray-800,
      .text-gray-900,
      .text-gray-700,
      .text-gray-600 {
        color: #f1f5f9 !important;
      }
      .text-gray-500,
      .text-gray-400,
      .text-gray-600 {
        color: #94a3b8 !important;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
      }

      input,
      select,
      textarea {
        background: rgba(15, 23, 42, 0.8) !important; /* Darker background */
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        color: #e2e8f0 !important;
        border-radius: 0.5rem !important;
        color-scheme: dark; /* Forces native dark mode dropdown */
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #3b82f6 !important;
      }

      /* ====== FIX FOR WHITE DROPDOWN MENU ====== */
      option {
        background-color: #1e293b !important; /* Dark slate background */
        color: #f1f5f9 !important; /* Bright white text */
        padding: 10px !important;
      }
      /* For Firefox compatibility */
      select option {
        background-color: #1e293b !important;
        color: #f1f5f9 !important;
      }

      .hover-card {
        transition: all 0.3s ease;
      }
      .hover-card:hover {
        transform: translateY(-5px);
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.5),
          0 10px 10px -5px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- 3D Animation Background -->
    <div id="three-bg"></div>

    <nav class="bg-white shadow-md p-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center text-xl font-bold">
        <i class="fas fa-arrow-left mr-3 text-blue-400"></i> Back to Dashboard
      </a>
      <span class="text-gray-400">Book a Service</span>
    </nav>

    <div class="max-w-3xl mx-auto mt-10 px-4">
      <div class="bg-white rounded-xl shadow-lg p-8">
        <h2 class="text-2xl font-bold mb-6">Schedule Care Service</h2>

        <form id="bookingForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium">Select Service</label>
            <select
              id="service"
              class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
            >
              <option value="Nursing Care">Nursing Care (₹2,125/hr)</option>
              <option value="Elderly Attendant">
                Elderly Attendant (₹1,530/hr)
              </option>
              <option value="Physiotherapy">Physiotherapy (₹2,975/hr)</option>
              <option value="Post-Hospital Care">
                Post-Hospital Care (₹2,550/hr)
              </option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium">Select Caregiver</label>
            <select
              id="caregiver"
              class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
            >
              <option value="Sarah Johnson">Sarah Johnson (Nurse)</option>
              <option value="Michael Chen">
                Michael Chen (Physiotherapist)
              </option>
              <option value="Emily Rodriguez">
                Emily Rodriguez (Attendant)
              </option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium">Date</label>
              <input
                type="date"
                id="date"
                class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium">Time</label>
              <input
                type="time"
                id="time"
                class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
                required
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium">Duration (Hours)</label>
            <input
              type="number"
              id="duration"
              value="2"
              min="1"
              class="w-full mt-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md shadow-blue-500/30"
          >
            <i class="fas fa-calendar-check mr-2"></i> Confirm Booking
          </button>
        </form>

        <div
          id="successMessage"
          class="hidden mt-4 p-4 bg-green-500/20 text-green-400 rounded-lg border border-green-500/30"
        >
          <i class="fas fa-check-circle mr-2"></i> Booking Successful!
          Redirecting to main dashboard...
        </div>
      </div>
    </div>

    <script>
      // --- Auto-select service from URL ---
      const urlParams = new URLSearchParams(window.location.search);
      const preselectedService = urlParams.get("service");

      if (preselectedService) {
        const serviceSelect = document.getElementById("service");
        const decodedService = decodeURIComponent(preselectedService);
        for (let i = 0; i < serviceSelect.options.length; i++) {
          if (serviceSelect.options[i].value === decodedService) {
            serviceSelect.selectedIndex = i;
            break;
          }
        }
      }

      document
        .getElementById("bookingForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const userId = localStorage.getItem("currentUserId");

          if (!userId) {
            alert("Please login first!");
            window.location.href = "login.html";
            return;
          }

          const booking = {
            service: document.getElementById("service").value,
            caregiver: document.getElementById("caregiver").value,
            date: document.getElementById("date").value,
            time: document.getElementById("time").value,
            duration: parseInt(document.getElementById("duration").value),
            amount: calculateAmount(
              document.getElementById("service").value,
              document.getElementById("duration").value,
            ),
            userId: parseInt(userId), // CRITICAL LINE
          };

          // DEBUG: Check if booking is being created with userId
          console.log("📦 Booking Sent to Database:", booking);

          createBooking(booking);

          document.getElementById("successMessage").classList.remove("hidden");
          document.getElementById("bookingForm").style.display = "none";

          setTimeout(() => {
            window.location.replace("index.html");
          }, 2000);
        });

      function calculateAmount(service, hours) {
        const rates = {
          "Nursing Care": 2125,
          "Elderly Attendant": 1530,
          Physiotherapy: 2975,
          "Post-Hospital Care": 2550,
        };
        return rates[service] * parseInt(hours);
      }
    </script>

    <!-- ====== 3D ANIMATION ENGINE ====== -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      const container = document.getElementById("three-bg");
      const scene = new THREE.Scene();

      const canvas = document.createElement("canvas");
      canvas.width = 2;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, "#0a1628");
      gradient.addColorStop(0.5, "#0f2847");
      gradient.addColorStop(1, "#1a365d");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 2, 512);
      scene.background = new THREE.CanvasTexture(canvas);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 10);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.5;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x88bbff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);
      scene.add(new THREE.PointLight(0x3b82f6, 2.0).position.set(-5, 0, -5));
      scene.add(new THREE.PointLight(0xec4899, 1.2).position.set(5, -3, -2));
      scene.add(new THREE.PointLight(0x60a5fa, 1.5).position.set(0, 5, 0));

      const group = new THREE.Group();
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0x3b82f6,
        emissive: 0x3b82f6,
        emissiveIntensity: 0.8,
        transparent: true,
        opacity: 0.9,
      });
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(2.2, 0.06, 16, 100),
        ringMat,
      );
      ring.rotation.x = Math.PI / 2;
      group.add(ring);

      const ringMat2 = new THREE.MeshStandardMaterial({
        color: 0xec4899,
        emissive: 0xec4899,
        emissiveIntensity: 1.0,
        transparent: true,
        opacity: 0.6,
      });
      const ring2 = new THREE.Mesh(
        new THREE.TorusGeometry(2.0, 0.02, 16, 100),
        ringMat2,
      );
      ring2.rotation.x = Math.PI / 2;
      ring2.rotation.z = 0.2;
      group.add(ring2);

      const crossGroup = new THREE.Group();
      const barMat = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xef4444,
        emissiveIntensity: 1.2,
      });
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 0.2), barMat),
      );
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.4, 0.2), barMat),
      );
      crossGroup.position.set(0, 0, 0.5);
      group.add(crossGroup);

      const icons = [
        { color: 0x3b82f6, shape: "sphere", pos: [3.2, 2.0, 0], size: 0.25 },
        { color: 0x22c55e, shape: "sphere", pos: [-3.2, -2.0, 0], size: 0.25 },
        { color: 0xa855f7, shape: "box", pos: [3.2, -2.0, 0], size: 0.3 },
        { color: 0xf59e0b, shape: "box", pos: [-3.2, 2.0, 0], size: 0.3 },
        { color: 0xec4899, shape: "sphere", pos: [0, 3.5, 0], size: 0.2 },
        { color: 0x06b6d4, shape: "box", pos: [0, -3.5, 0], size: 0.25 },
      ];
      icons.forEach((ic) => {
        const mat = new THREE.MeshStandardMaterial({
          color: ic.color,
          emissive: ic.color,
          emissiveIntensity: 0.6,
          metalness: 0.3,
          roughness: 0.2,
        });
        const geo =
          ic.shape === "sphere"
            ? new THREE.SphereGeometry(ic.size, 24, 24)
            : new THREE.BoxGeometry(ic.size, ic.size, ic.size);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(ic.pos[0], ic.pos[1], ic.pos[2]);
        group.add(mesh);
      });

      const pCount = 800;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pCol = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        pPos[i * 3] = (Math.random() - 0.5) * 24;
        pPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
        pPos[i * 3 + 2] = (Math.random() - 0.5) * 10;
        const c = new THREE.Color().setHSL(
          0.55 + Math.random() * 0.2,
          0.9,
          0.5 + Math.random() * 0.3,
        );
        pCol[i * 3] = c.r;
        pCol[i * 3 + 1] = c.g;
        pCol[i * 3 + 2] = c.b;
      }
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
      group.add(
        new THREE.Points(
          pGeo,
          new THREE.PointsMaterial({
            size: 0.05,
            transparent: true,
            opacity: 0.9,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
          }),
        ),
      );

      const heartGroup = new THREE.Group();
      const heartMat = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xef4444,
        emissiveIntensity: 0.5,
        transparent: true,
        opacity: 0.6,
      });
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const heart = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 8, 8),
          heartMat,
        );
        heart.position.set(
          Math.cos(angle) * 4.2,
          Math.sin(angle) * 4.2 * 0.6,
          0,
        );
        heartGroup.add(heart);
      }
      group.add(heartGroup);

      scene.add(group);

      function animate() {
        requestAnimationFrame(animate);
        group.rotation.y += 0.005;
        group.rotation.x = Math.sin(Date.now() * 0.0004) * 0.1;
        const scale = 1 + Math.sin(Date.now() * 0.003) * 0.08;
        crossGroup.scale.set(scale, scale, scale);
        heartGroup.rotation.y += 0.01;
        heartGroup.rotation.x = Math.sin(Date.now() * 0.0005) * 0.1;
        ringMat2.opacity = 0.4 + Math.sin(Date.now() * 0.002) * 0.2;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
