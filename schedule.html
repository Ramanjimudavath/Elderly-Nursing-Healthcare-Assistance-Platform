<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule - ElderlyCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Load Data Service -->
    <script src="data-service.js"></script>

    <style>
      * {
        font-family: "Inter", sans-serif;
      }
      #three-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }

      body {
        background: transparent;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      .bg-white,
      .bg-gray-50,
      .bg-gray-100 {
        background: rgba(15, 23, 42, 0.6) !important;
        backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        color: #e2e8f0 !important;
      }
      nav.bg-white {
        background: rgba(15, 23, 42, 0.85) !important;
        backdrop-filter: blur(16px) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5) !important;
      }
      h1,
      h2,
      h3,
      h4,
      .text-gray-800,
      .text-gray-900,
      .text-gray-700,
      .text-gray-600 {
        color: #f1f5f9 !important;
      }
      .text-gray-500,
      .text-gray-400 {
        color: #94a3b8 !important;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
      }

      /* ====== FIX FOR DROPDOWN CLARITY ====== */
      input,
      select,
      textarea {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #e2e8f0 !important;
        border-radius: 0.5rem !important;
        color-scheme: dark !important;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #3b82f6 !important;
      }

      option {
        background-color: #1e293b !important;
        color: #f1f5f9 !important;
        padding: 10px !important;
      }
      select option {
        background-color: #1e293b !important;
        color: #f1f5f9 !important;
      }

      .hover-card {
        transition: all 0.3s ease;
      }
      .hover-card:hover {
        transform: translateY(-5px);
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.5),
          0 10px 10px -5px rgba(0, 0, 0, 0.3);
      }
      .status-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .status-active {
        background: rgba(52, 211, 153, 0.2);
        color: #34d399;
        border: 1px solid rgba(52, 211, 153, 0.3);
      }
      .status-pending {
        background: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
        border: 1px solid rgba(251, 191, 36, 0.3);
      }
      .status-inactive {
        background: rgba(59, 130, 246, 0.2);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="three-bg"></div>

    <nav class="bg-white shadow-lg sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <div class="flex items-center">
            <i
              class="fas fa-arrow-left text-blue-400 text-xl mr-3 cursor-pointer hover:text-blue-300"
              onclick="window.location.href = 'index.html'"
            ></i>
            <span class="text-2xl font-bold">ElderlyCare</span>
          </div>
          <span class="text-gray-400 text-lg">Schedule Management</span>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
          <h2 class="text-2xl font-bold mb-4">Upcoming Appointments</h2>

          <!-- Dynamic List Container -->
          <div
            id="appointmentListContainer"
            class="bg-white rounded-xl shadow-md p-6 hover-card border border-white/10 space-y-4"
          >
            <!-- Appointments will be injected here by JavaScript -->

            <button
              onclick="window.location.href = 'book-service.html'"
              class="w-full mt-2 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition shadow-lg shadow-blue-500/30"
            >
              <i class="fas fa-plus mr-2"></i> Add New Appointment
            </button>
          </div>
        </div>
        <div>
          <h2 class="text-2xl font-bold mb-4">Quick Schedule</h2>
          <div
            class="bg-white rounded-xl shadow-md p-6 hover-card border border-white/10"
          >
            <form id="quickScheduleForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-400"
                  >Service Type</label
                >
                <select
                  id="quickService"
                  class="w-full mt-1 p-2 bg-white/5 border border-white/10 rounded-lg text-gray-300"
                >
                  <option>Nursing Care</option>
                  <option>Elderly Attendant</option>
                  <option>Physiotherapy</option>
                  <option>Post-Hospital Care</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-400"
                  >Date</label
                >
                <input
                  type="date"
                  id="quickDate"
                  class="w-full mt-1 p-2 bg-white/5 border border-white/10 rounded-lg text-gray-300"
                  required
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-400"
                  >Time</label
                >
                <input
                  type="time"
                  id="quickTime"
                  class="w-full mt-1 p-2 bg-white/5 border border-white/10 rounded-lg text-gray-300"
                  required
                />
              </div>
              <button
                type="submit"
                class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition shadow-lg shadow-green-500/30"
              >
                <i class="fas fa-calendar-check mr-2"></i> Schedule Now
              </button>
            </form>

            <div
              id="scheduleSuccess"
              class="hidden mt-4 p-3 bg-green-500/20 text-green-400 rounded-lg text-center border border-green-500/30 text-sm"
            >
              <i class="fas fa-check-circle mr-2"></i> Appointment Scheduled
              Successfully!
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ====== 3D ANIMATION ENGINE ====== -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      const container = document.getElementById("three-bg");
      const scene = new THREE.Scene();

      const canvas = document.createElement("canvas");
      canvas.width = 2;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, "#0a1628");
      gradient.addColorStop(0.5, "#0f2847");
      gradient.addColorStop(1, "#1a365d");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 2, 512);
      scene.background = new THREE.CanvasTexture(canvas);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 10);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.5;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x88bbff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);
      scene.add(new THREE.PointLight(0x3b82f6, 2.0).position.set(-5, 0, -5));
      scene.add(new THREE.PointLight(0xec4899, 1.2).position.set(5, -3, -2));
      scene.add(new THREE.PointLight(0x60a5fa, 1.5).position.set(0, 5, 0));

      const group = new THREE.Group();
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0x3b82f6,
        emissive: 0x3b82f6,
        emissiveIntensity: 0.8,
        transparent: true,
        opacity: 0.9,
      });
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(2.2, 0.06, 16, 100),
        ringMat,
      );
      ring.rotation.x = Math.PI / 2;
      group.add(ring);

      const ringMat2 = new THREE.MeshStandardMaterial({
        color: 0xec4899,
        emissive: 0xec4899,
        emissiveIntensity: 1.0,
        transparent: true,
        opacity: 0.6,
      });
      const ring2 = new THREE.Mesh(
        new THREE.TorusGeometry(2.0, 0.02, 16, 100),
        ringMat2,
      );
      ring2.rotation.x = Math.PI / 2;
      ring2.rotation.z = 0.2;
      group.add(ring2);

      const crossGroup = new THREE.Group();
      const barMat = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xef4444,
        emissiveIntensity: 1.2,
      });
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 0.2), barMat),
      );
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.4, 0.2), barMat),
      );
      crossGroup.position.set(0, 0, 0.5);
      group.add(crossGroup);

      const pCount = 800;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pCol = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        pPos[i * 3] = (Math.random() - 0.5) * 24;
        pPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
        pPos[i * 3 + 2] = (Math.random() - 0.5) * 10;
        const c = new THREE.Color().setHSL(
          0.55 + Math.random() * 0.2,
          0.9,
          0.5 + Math.random() * 0.3,
        );
        pCol[i * 3] = c.r;
        pCol[i * 3 + 1] = c.g;
        pCol[i * 3 + 2] = c.b;
      }
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
      group.add(
        new THREE.Points(
          pGeo,
          new THREE.PointsMaterial({
            size: 0.05,
            transparent: true,
            opacity: 0.9,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
          }),
        ),
      );

      scene.add(group);

      function animate() {
        requestAnimationFrame(animate);
        group.rotation.y += 0.005;
        group.rotation.x = Math.sin(Date.now() * 0.0004) * 0.1;
        const scale = 1 + Math.sin(Date.now() * 0.003) * 0.08;
        crossGroup.scale.set(scale, scale, scale);
        ringMat2.opacity = 0.4 + Math.sin(Date.now() * 0.002) * 0.2;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>

    <!-- ====== APPLICATION LOGIC ====== -->
    <script>
      // 1. Check if user is logged in
      const userId = localStorage.getItem("currentUserId");
      if (!userId) {
        alert("Please login first to manage your schedule!");
        window.location.href = "login.html";
      }

      // 2. Function to Render Appointments
      function renderAppointments() {
        const container = document.getElementById("appointmentListContainer");
        const allBookings = getUserBookings(parseInt(userId));

        // Filter to show only future/active bookings (Pending or In Progress)
        const activeBookings = allBookings.filter(
          (b) => b.status === "Pending" || b.status === "In Progress",
        );

        // Clear existing items (keep the button)
        const addButton = container.querySelector("button");
        container.innerHTML = "";

        if (activeBookings.length === 0) {
          container.innerHTML = `
            <div class="text-center py-8 text-gray-400">
              <i class="fas fa-calendar-times text-4xl mb-2 opacity-50"></i>
              <p>No upcoming appointments scheduled.</p>
            </div>
          `;
        } else {
          // Loop through bookings and create HTML
          activeBookings.forEach((b, index) => {
            // Determine color based on service type for the icon
            let colorClass = "bg-blue-500/20 border-blue-500/30 text-blue-400";
            if (b.service === "Elderly Attendant")
              colorClass = "bg-green-500/20 border-green-500/30 text-green-400";
            if (b.service === "Physiotherapy")
              colorClass =
                "bg-purple-500/20 border-purple-500/30 text-purple-400";
            if (b.service === "Post-Hospital Care")
              colorClass =
                "bg-orange-500/20 border-orange-500/30 text-orange-400";

            // Format the date
            const dateObj = new Date(b.date);
            const formattedDate = dateObj.toLocaleDateString("en-US", {
              year: "numeric",
              month: "short",
              day: "numeric",
            });

            // Build the item
            const item = `
              <div class="flex items-center justify-between ${index !== activeBookings.length - 1 ? "border-b border-white/5 pb-4" : ""}">
                <div class="flex items-center space-x-4">
                  <div class="w-12 h-12 ${colorClass} rounded-full flex items-center justify-center border">
                    <i class="fas fa-calendar-day text-xl"></i>
                  </div>
                  <div>
                    <h4 class="font-semibold">${b.service} with ${b.caregiver}</h4>
                    <p class="text-sm text-gray-400">${formattedDate}, ${b.time}</p>
                  </div>
                </div>
                <span class="status-badge ${b.status === "Pending" ? "status-pending" : "status-active"}">
                  ${b.status}
                </span>
              </div>
            `;
            container.innerHTML += item;
          });
        }

        // Re-add the button at the bottom
        container.innerHTML += `
          <button onclick="window.location.href='book-service.html'" class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition shadow-lg shadow-blue-500/30">
            <i class="fas fa-plus mr-2"></i> Add New Appointment
          </button>
        `;
      }

      // 3. Handle Quick Schedule Form Submission
      document
        .getElementById("quickScheduleForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const service = document.getElementById("quickService").value;
          const date = document.getElementById("quickDate").value;
          const time = document.getElementById("quickTime").value;

          // Create a dummy booking object
          const newBooking = {
            userId: parseInt(userId),
            service: service,
            caregiver: "Pending Assignment", // Placeholder until assigned
            date: date,
            time: time,
            duration: 1, // Default
            amount: 0, // Default
            status: "Pending",
          };

          // Save to database
          createBooking(newBooking);

          // Show success message
          const successMsg = document.getElementById("scheduleSuccess");
          successMsg.classList.remove("hidden");

          // Reset form
          document.getElementById("quickScheduleForm").reset();

          // Refresh the list after 1 second
          setTimeout(() => {
            successMsg.classList.add("hidden");
            renderAppointments();
          }, 1500);
        });

      // 4. Initial Load
      renderAppointments();
    </script>
  </body>
</html>
