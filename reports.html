<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports & Analytics - ElderlyCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="data-service.js"></script>

    <style>
      * {
        font-family: "Inter", sans-serif;
      }
      #three-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }

      body {
        background: transparent;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      .bg-white,
      .bg-gray-50,
      .bg-gray-100 {
        background: rgba(15, 23, 42, 0.6) !important;
        backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        color: #e2e8f0 !important;
      }
      nav.bg-white {
        background: rgba(15, 23, 42, 0.85) !important;
        backdrop-filter: blur(16px) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5) !important;
      }
      h1,
      h2,
      h3,
      h4,
      .text-gray-800,
      .text-gray-900,
      .text-gray-700,
      .text-gray-600 {
        color: #f1f5f9 !important;
      }
      .text-gray-500,
      .text-gray-400 {
        color: #94a3b8 !important;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 10px;
      }
      .hover-card {
        transition: all 0.3s ease;
      }
      .hover-card:hover {
        transform: translateY(-5px);
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.5),
          0 10px 10px -5px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="three-bg"></div>

    <nav class="bg-white shadow-md p-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center text-xl font-bold">
        <i class="fas fa-arrow-left mr-3 text-blue-400"></i> Back to Dashboard
      </a>
      <span class="text-gray-400">Analytics & Reports</span>
    </nav>

    <div class="max-w-6xl mx-auto mt-10 px-4">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Generated Reports</h2>
        <button
          onclick="generateNewReport()"
          class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition shadow-md shadow-blue-500/30"
        >
          <i class="fas fa-sync mr-2"></i> Generate New Report
        </button>
      </div>

      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th
                class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase"
              >
                Report Type
              </th>
              <th
                class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase"
              >
                Date Generated
              </th>
              <th
                class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase"
              >
                Value/Insight
              </th>
              <th
                class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase"
              >
                Status
              </th>
              <th
                class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase"
              >
                Actions
              </th>
            </tr>
          </thead>
          <tbody
            id="reportTableBody"
            class="bg-white divide-y divide-gray-200"
          ></tbody>
        </table>
      </div>
    </div>

    <script>
      function loadReports() {
        const reports = getReports();
        const tbody = document.getElementById("reportTableBody");
        tbody.innerHTML = "";

        if (reports.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No reports generated yet.</td></tr>`;
          return;
        }

        reports.reverse().forEach((r) => {
          const row = `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-300">${r.type}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">${r.date}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300 font-semibold">${r.value}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-500/20 text-green-400 border border-green-500/30">
                                ${r.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">
                            <button class="text-blue-400 hover:text-blue-300"><i class="fas fa-download"></i> Download</button>
                        </td>
                    </tr>
                `;
          tbody.innerHTML += row;
        });
      }

      function generateNewReport() {
        const types = [
          "Monthly Revenue",
          "Caregiver Performance",
          "Service Popularity",
          "User Growth",
        ];
        const randomType = types[Math.floor(Math.random() * types.length)];

        generateReport(randomType);
        loadReports();

        const btn = document.querySelector("button");
        btn.innerHTML = '<i class="fas fa-check mr-2"></i> Generated!';
        setTimeout(() => {
          btn.innerHTML =
            '<i class="fas fa-sync mr-2"></i> Generate New Report';
        }, 2000);
      }

      loadReports();
    </script>

    <!-- ====== 3D ANIMATION ENGINE ====== -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      const container = document.getElementById("three-bg");
      const scene = new THREE.Scene();

      const canvas = document.createElement("canvas");
      canvas.width = 2;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, "#0a1628");
      gradient.addColorStop(0.5, "#0f2847");
      gradient.addColorStop(1, "#1a365d");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 2, 512);
      scene.background = new THREE.CanvasTexture(canvas);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 10);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.5;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x88bbff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);
      scene.add(new THREE.PointLight(0x3b82f6, 2.0).position.set(-5, 0, -5));
      scene.add(new THREE.PointLight(0xec4899, 1.2).position.set(5, -3, -2));
      scene.add(new THREE.PointLight(0x60a5fa, 1.5).position.set(0, 5, 0));

      const group = new THREE.Group();
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0x3b82f6,
        emissive: 0x3b82f6,
        emissiveIntensity: 0.8,
        transparent: true,
        opacity: 0.9,
      });
      group.add(
        (new THREE.Mesh(
          new THREE.TorusGeometry(2.2, 0.06, 16, 100),
          ringMat,
        ).rotation.x = Math.PI / 2),
      );

      const ringMat2 = new THREE.MeshStandardMaterial({
        color: 0xec4899,
        emissive: 0xec4899,
        emissiveIntensity: 1.0,
        transparent: true,
        opacity: 0.6,
      });
      const ring2 = new THREE.Mesh(
        new THREE.TorusGeometry(2.0, 0.02, 16, 100),
        ringMat2,
      );
      ring2.rotation.x = Math.PI / 2;
      ring2.rotation.z = 0.2;
      group.add(ring2);

      const crossGroup = new THREE.Group();
      const barMat = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xef4444,
        emissiveIntensity: 1.2,
      });
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 0.2), barMat),
      );
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.4, 0.2), barMat),
      );
      crossGroup.position.set(0, 0, 0.5);
      group.add(crossGroup);

      const pCount = 800;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pCol = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        pPos[i * 3] = (Math.random() - 0.5) * 24;
        pPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
        pPos[i * 3 + 2] = (Math.random() - 0.5) * 10;
        const c = new THREE.Color().setHSL(
          0.55 + Math.random() * 0.2,
          0.9,
          0.5 + Math.random() * 0.3,
        );
        pCol[i * 3] = c.r;
        pCol[i * 3 + 1] = c.g;
        pCol[i * 3 + 2] = c.b;
      }
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
      group.add(
        new THREE.Points(
          pGeo,
          new THREE.PointsMaterial({
            size: 0.05,
            transparent: true,
            opacity: 0.9,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
          }),
        ),
      );

      scene.add(group);

      function animate() {
        requestAnimationFrame(animate);
        group.rotation.y += 0.005;
        group.rotation.x = Math.sin(Date.now() * 0.0004) * 0.1;
        const scale = 1 + Math.sin(Date.now() * 0.003) * 0.08;
        crossGroup.scale.set(scale, scale, scale);
        ringMat2.opacity = 0.4 + Math.sin(Date.now() * 0.002) * 0.2;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
