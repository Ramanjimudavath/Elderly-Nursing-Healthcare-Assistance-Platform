<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - ElderlyCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="data-service.js"></script>

    <style>
      #three-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }
      body {
        background: transparent;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
      }
      .bg-glass {
        background: rgba(15, 23, 42, 0.7) !important;
        backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
      }
      input,
      select {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #e2e8f0 !important;
        border-radius: 0.5rem !important;
      }
      input:focus,
      select:focus {
        outline: 2px solid #3b82f6 !important;
      }
      .toggle-switch {
        position: relative;
        width: 50px;
        height: 28px;
        background: #475569;
        border-radius: 14px;
        cursor: pointer;
        transition: 0.3s;
      }
      .toggle-switch.active {
        background: #3b82f6;
      }
      .toggle-circle {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 24px;
        height: 24px;
        background: white;
        border-radius: 50%;
        transition: 0.3s;
      }
      .toggle-switch.active .toggle-circle {
        left: 24px;
      }
    </style>
  </head>
  <body>
    <div id="three-bg"></div>

    <nav
      class="bg-glass shadow-md p-4 flex items-center justify-between sticky top-0 z-50"
    >
      <a href="index.html" class="flex items-center text-xl font-bold">
        <i class="fas fa-arrow-left mr-3 text-blue-400"></i> Back to Dashboard
      </a>
      <span class="text-gray-400">Settings</span>
    </nav>

    <div class="max-w-3xl mx-auto mt-10 px-4 relative z-10">
      <div class="bg-glass rounded-2xl shadow-xl p-8 space-y-8">
        <!-- Dark Mode Setting -->
        <div
          class="flex items-center justify-between border-b border-white/10 pb-6"
        >
          <div>
            <h3 class="text-lg font-bold">Dark Mode</h3>
            <p class="text-sm text-gray-400">
              Enable dark theme for the entire platform
            </p>
          </div>
          <div id="darkModeToggle" class="toggle-switch">
            <div class="toggle-circle"></div>
          </div>
        </div>

        <!-- Change Password Setting -->
        <div class="border-b border-white/10 pb-6">
          <h3 class="text-lg font-bold mb-4">Change Password</h3>
          <form id="passwordForm" class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-400"
                >Current Password</label
              >
              <input
                type="password"
                id="currentPass"
                required
                class="w-full mt-1 p-2"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400"
                >New Password</label
              >
              <input
                type="password"
                id="newPass"
                required
                minlength="6"
                class="w-full mt-1 p-2"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400"
                >Confirm New Password</label
              >
              <input
                type="password"
                id="confirmPass"
                required
                minlength="6"
                class="w-full mt-1 p-2"
              />
            </div>
            <button
              type="submit"
              class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition shadow-lg shadow-blue-500/30"
            >
              Update Password
            </button>
            <div id="passError" class="hidden text-red-400 text-sm mt-2"></div>
            <div id="passSuccess" class="hidden text-green-400 text-sm mt-2">
              Password updated successfully!
            </div>
          </form>
        </div>

        <!-- Notification Settings -->
        <div>
          <h3 class="text-lg font-bold mb-4">Notification Preferences</h3>
          <div class="space-y-3">
            <label class="flex items-center space-x-3 cursor-pointer">
              <input
                type="checkbox"
                checked
                class="w-4 h-4 rounded border-white/10 bg-white/5 focus:ring-2 focus:ring-blue-500"
              />
              <span class="text-sm"
                >Email notifications for booking updates</span
              >
            </label>
            <label class="flex items-center space-x-3 cursor-pointer">
              <input
                type="checkbox"
                checked
                class="w-4 h-4 rounded border-white/10 bg-white/5 focus:ring-2 focus:ring-blue-500"
              />
              <span class="text-sm"
                >SMS notifications for appointment reminders</span
              >
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- ====== 3D ANIMATION ENGINE ====== -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      const container = document.getElementById("three-bg");
      const scene = new THREE.Scene();
      const canvas = document.createElement("canvas");
      canvas.width = 2;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, "#0a1628");
      gradient.addColorStop(0.5, "#0f2847");
      gradient.addColorStop(1, "#1a365d");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 2, 512);
      scene.background = new THREE.CanvasTexture(canvas);
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 0, 10);
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.5;
      container.appendChild(renderer.domElement);
      scene.add(new THREE.AmbientLight(0x88bbff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight.position.set(5, 5, 5);
      scene.add(dirLight);
      scene.add(new THREE.PointLight(0x3b82f6, 2.0).position.set(-5, 0, -5));
      scene.add(new THREE.PointLight(0xec4899, 1.2).position.set(5, -3, -2));
      scene.add(new THREE.PointLight(0x60a5fa, 1.5).position.set(0, 5, 0));
      const group = new THREE.Group();
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0x3b82f6,
        emissive: 0x3b82f6,
        emissiveIntensity: 0.8,
        transparent: true,
        opacity: 0.9,
      });
      group.add(
        (new THREE.Mesh(
          new THREE.TorusGeometry(2.2, 0.06, 16, 100),
          ringMat,
        ).rotation.x = Math.PI / 2),
      );
      const crossGroup = new THREE.Group();
      const barMat = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xef4444,
        emissiveIntensity: 1.2,
      });
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 0.2), barMat),
      );
      crossGroup.add(
        new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.4, 0.2), barMat),
      );
      crossGroup.position.set(0, 0, 0.5);
      group.add(crossGroup);
      const pCount = 800;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pCol = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        pPos[i * 3] = (Math.random() - 0.5) * 24;
        pPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
        pPos[i * 3 + 2] = (Math.random() - 0.5) * 10;
        const c = new THREE.Color().setHSL(
          0.55 + Math.random() * 0.2,
          0.9,
          0.5 + Math.random() * 0.3,
        );
        pCol[i * 3] = c.r;
        pCol[i * 3 + 1] = c.g;
        pCol[i * 3 + 2] = c.b;
      }
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
      group.add(
        new THREE.Points(
          pGeo,
          new THREE.PointsMaterial({
            size: 0.05,
            transparent: true,
            opacity: 0.9,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
          }),
        ),
      );
      scene.add(group);
      function animate() {
        requestAnimationFrame(animate);
        group.rotation.y += 0.005;
        group.rotation.x = Math.sin(Date.now() * 0.0004) * 0.1;
        const scale = 1 + Math.sin(Date.now() * 0.003) * 0.08;
        crossGroup.scale.set(scale, scale, scale);
        renderer.render(scene, camera);
      }
      animate();
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>

    <script>
      const userId = localStorage.getItem("currentUserId");
      if (!userId) {
        alert("Please login first!");
        window.location.href = "login.html";
      }

      // --- Dark Mode Toggle ---
      const toggle = document.getElementById("darkModeToggle");
      // Check for saved preference
      if (localStorage.getItem("darkMode") === "enabled") {
        document.documentElement.classList.add("dark");
        toggle.classList.add("active");
      }

      toggle.addEventListener("click", function () {
        this.classList.toggle("active");
        if (this.classList.contains("active")) {
          document.documentElement.classList.add("dark");
          localStorage.setItem("darkMode", "enabled");
          // Reload to apply dark theme globally
          window.location.reload();
        } else {
          document.documentElement.classList.remove("dark");
          localStorage.setItem("darkMode", "disabled");
          window.location.reload();
        }
      });

      // --- Change Password ---
      document
        .getElementById("passwordForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const currentPass = document.getElementById("currentPass").value;
          const newPass = document.getElementById("newPass").value;
          const confirmPass = document.getElementById("confirmPass").value;

          const db = JSON.parse(localStorage.getItem("elderlyCareData"));
          const currentUser = db.users.find((u) => u.id == userId);

          if (currentUser.password !== currentPass) {
            const err = document.getElementById("passError");
            err.textContent = "Current password is incorrect.";
            err.classList.remove("hidden");
            return;
          }

          if (newPass !== confirmPass) {
            const err = document.getElementById("passError");
            err.textContent = "New passwords do not match.";
            err.classList.remove("hidden");
            return;
          }

          // Update Password
          currentUser.password = newPass;
          const userIndex = db.users.findIndex((u) => u.id == userId);
          db.users[userIndex] = currentUser;
          localStorage.setItem("elderlyCareData", JSON.stringify(db));

          document.getElementById("passSuccess").classList.remove("hidden");
          document.getElementById("passError").classList.add("hidden");
          document.getElementById("passwordForm").reset();
          setTimeout(() => {
            document.getElementById("passSuccess").classList.add("hidden");
          }, 3000);
        });
    </script>
  </body>
</html>
